# Render blueprint for the Unify API (notes-engine, combined app + authoring backend).
# Create via Render Dashboard > New > Blueprint > select this repo.
# Free tier sleeps after ~15 min idle: first request can take 30-60s.
# The web client (lib/api.ts) warms /healthz and retries once for this.
services:
  - type: web
    name: unify-api
    runtime: node
    rootDir: notes-engine
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.12.0
      - key: SUPABASE_URL
        sync: false # set in Render dashboard
      - key: SUPABASE_ANON_KEY
        sync: false # set in Render dashboard
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # set in Render dashboard (secret)
      - key: DATABASE_URL
        sync: false # Supabase pooler :6543 (Prisma app traffic)
      - key: DIRECT_URL
        sync: false # Supabase direct :5432 (prisma migrate deploy)
      - key: CORS_ORIGIN
        value: https://your-app.vercel.app # <-- replace with the real Vercel URL
      - key: ANTHROPIC_API_KEY
        sync: false # optional: only for /api/convert authoring
