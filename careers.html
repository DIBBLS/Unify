<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unify — Career</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
<script src="js/theme.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f4f0;--surface:#ffffff;--surface2:#f8f7f3;--border:#e0deda;
  --text:#0a0a0a;--text2:#555;--text3:#999;
  --green:#4ade80;--green-deep:#16a34a;
  --font-display:'Playfair Display',serif;--font-body:'DM Sans',sans-serif;
}
[data-theme="dark"]{
  --bg:#0f0f0f;--surface:#1a1a1a;--surface2:#222;--border:#2a2a2a;
  --text:#f0efeb;--text2:#aaa;--text3:#666;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;transition:background .25s,color .25s}

/* NAV */
nav{display:flex;align-items:center;justify-content:space-between;padding:0 48px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:100;height:60px;transition:background .25s,border-color .25s}
.nav-logo{font-family:var(--font-display);font-weight:900;font-size:20px;letter-spacing:-1px;text-decoration:none;color:var(--text)}
.nav-links{display:flex;gap:0;height:100%;align-items:stretch}
.nl{display:flex;align-items:center;padding:0 16px;font-size:13px;font-weight:500;color:var(--text3);text-decoration:none;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.nl:hover{color:var(--text)}
.nl.on{color:var(--text);border-bottom-color:var(--text)}
.nbtn{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 14px;font-size:12px;font-weight:500;font-family:var(--font-body);color:var(--text3);cursor:pointer;transition:all .15s}
.nbtn:hover{border-color:var(--text);color:var(--text)}
.nav-r{display:flex;align-items:center;gap:10px}

/* COMING SOON */
.coming-soon{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 60px);padding:40px 24px;text-align:center}
.cs-label{font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:20px}
.cs-title{font-family:var(--font-display);font-size:clamp(40px,8vw,80px);font-weight:900;letter-spacing:-2px;line-height:1;margin-bottom:20px}
.cs-sub{font-size:15px;color:var(--text2);max-width:400px;line-height:1.7;margin-bottom:40px}
.cs-badge{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border:1px solid var(--border);border-radius:100px;font-size:13px;font-weight:500;color:var(--text3)}
.cs-dot{width:8px;height:8px;border-radius:50%;background:var(--green-deep);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* MOBILE NAV */
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);z-index:200;padding:6px 0 calc(6px + env(safe-area-inset-bottom));transition:background .25s,border-color .25s}
.mobile-nav-inner{display:flex;justify-content:space-around}
.mobile-nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;cursor:pointer;font-family:var(--font-body);color:var(--text3);padding:6px 10px;border-radius:10px;transition:all .15s;text-decoration:none;min-width:52px}
.mobile-nav-btn.active{color:var(--text)}
.mobile-nav-icon{font-size:22px;line-height:1}
.mobile-nav-label{font-size:10px;font-weight:500}
.mobile-nav-dot{width:4px;height:4px;border-radius:50%;background:var(--text);margin-top:2px;opacity:0;transition:opacity .15s}

@media(max-width:600px){
  nav{padding:0 16px}
  .nav-links{display:none}
  .mobile-nav{display:block}
  .coming-soon{padding-bottom:80px}
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Unify</a>
  <div class="nav-links">
    <a href="dashboard.html" class="nl">Dashboard</a>
    <a href="timetable.html" class="nl">Timetable</a>
    <a href="profile.html" class="nl">Profile</a>
  </div>
  <div class="nav-r">
    <button class="nbtn" onclick="toggleTheme()" id="themeToggle">Dark mode</button>
  </div>
</nav>

<nav class="mobile-nav">
  <div class="mobile-nav-inner">
    <a href="dashboard.html" class="mobile-nav-btn">
      <span class="mobile-nav-icon">🏠</span>
      <span class="mobile-nav-label">Dashboard</span>
      <div class="mobile-nav-dot"></div>
    </a>
    <a href="timetable.html" class="mobile-nav-btn">
      <span class="mobile-nav-icon">📅</span>
      <span class="mobile-nav-label">Timetable</span>
      <div class="mobile-nav-dot"></div>
    </a>
    <a href="profile.html" class="mobile-nav-btn">
      <span class="mobile-nav-icon">👤</span>
      <span class="mobile-nav-label">Profile</span>
      <div class="mobile-nav-dot"></div>
    </a>
  </div>
</nav>

<div class="coming-soon">
  <p class="cs-label">Career Hub</p>
  <h1 class="cs-title">Coming<br><em>Soon.</em></h1>
  <p class="cs-sub">We're building something to help you map your engineering career — paths, skills, and opportunities, all in one place.</p>
  <div class="cs-badge">
    <span class="cs-dot"></span>
    In development
  </div>
</div>

<script>
(function(){
  const saved = localStorage.getItem('unify-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = saved || (prefersDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('themeToggle');
  if(btn) btn.textContent = theme === 'dark' ? 'Light mode' : 'Dark mode';
})();
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('unify-theme', next);
  document.getElementById('themeToggle').textContent = next === 'dark' ? 'Light mode' : 'Dark mode';
}
</script>
</body>
</html>
