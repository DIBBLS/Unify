<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unify — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --black: #0a0a0a; --white: #f5f4f0; --grey: #e0deda; --mid: #888;
  --font-display: 'Playfair Display', serif; --font-body: 'DM Sans', sans-serif;
}
body { background: var(--white); color: var(--black); font-family: var(--font-body); min-height: 100vh; display: flex; }

.auth-left {
  flex: 1; background: var(--black); color: var(--white);
  padding: 48px; display: flex; flex-direction: column; justify-content: space-between;
  min-height: 100vh; position: relative; overflow: hidden;
}
.auth-left-bg {
  position: absolute; bottom: -60px; left: -20px;
  font-family: var(--font-display); font-size: 28vw; font-weight: 900;
  color: transparent; -webkit-text-stroke: 1px #1a1a1a;
  line-height: 1; pointer-events: none; user-select: none;
}
.auth-logo { font-family: var(--font-display); font-weight: 900; font-size: 24px; letter-spacing: -1px; text-decoration: none; color: var(--white); position: relative; z-index: 1; }
.auth-left-content { position: relative; z-index: 1; }
.auth-left-title { font-family: var(--font-display); font-size: clamp(36px, 4vw, 56px); font-weight: 900; line-height: 1.05; letter-spacing: -2px; margin-bottom: 20px; }
.auth-left-title em { font-style: italic; }
.auth-left-sub { font-size: 14px; color: #666; line-height: 1.7; font-weight: 300; max-width: 320px; }
.auth-left-footer { font-size: 11px; color: #333; position: relative; z-index: 1; }

.auth-right {
  width: 480px; flex-shrink: 0; padding: 48px;
  display: flex; flex-direction: column; justify-content: center;
  border-left: 1px solid var(--grey);
}

.auth-tabs { display: flex; gap: 0; margin-bottom: 40px; border: 1px solid var(--grey); border-radius: 6px; overflow: hidden; }
.auth-tab {
  flex: 1; padding: 10px; text-align: center; font-size: 13px; font-weight: 500;
  cursor: pointer; background: var(--white); color: var(--mid); transition: all 0.15s; border: none; font-family: var(--font-body);
}
.auth-tab.active { background: var(--black); color: var(--white); }

.auth-form { display: none; flex-direction: column; gap: 14px; }
.auth-form.active { display: flex; }

.form-label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid); margin-bottom: 4px; display: block; }
.form-input {
  width: 100%; padding: 12px 14px; background: var(--white);
  border: 1px solid var(--grey); border-radius: 6px;
  font-family: var(--font-body); font-size: 14px; color: var(--black);
  outline: none; transition: border-color 0.15s;
}
.form-input:focus { border-color: var(--black); }
.form-input::placeholder { color: #bbb; }

.btn-submit {
  width: 100%; padding: 14px; background: var(--black); color: var(--white);
  border: none; border-radius: 6px; font-family: var(--font-display);
  font-size: 15px; font-weight: 700; cursor: pointer; transition: opacity 0.2s; margin-top: 4px;
}
.btn-submit:hover { opacity: 0.8; }
.btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }

.divider { display: flex; align-items: center; gap: 12px; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--grey); }
.divider span { font-size: 11px; color: var(--mid); text-transform: uppercase; letter-spacing: 1px; }

.btn-google {
  width: 100%; padding: 12px; background: var(--white); color: var(--black);
  border: 1px solid var(--grey); border-radius: 6px; font-family: var(--font-body);
  font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.btn-google:hover { border-color: var(--black); }
.google-icon { width: 18px; height: 18px; }

.auth-error {
  background: #fff0f0; border: 1px solid #ffcccc; border-radius: 6px;
  padding: 10px 14px; font-size: 13px; color: #cc0000; display: none;
}
.auth-success {
  background: #f0fff4; border: 1px solid #b3f0c8; border-radius: 6px;
  padding: 10px 14px; font-size: 13px; color: #006620; display: none;
}

@media (max-width: 768px) {
  body { flex-direction: column; }
  .auth-left { min-height: 240px; padding: 32px 24px; }
  .auth-left-bg { font-size: 50vw; }
  .auth-right { width: 100%; padding: 32px 24px; border-left: none; border-top: 1px solid var(--grey); }
}
</style>
</head>
<body>

<div class="auth-left">
  <div class="auth-left-bg">U</div>
  <a href="index.html" class="auth-logo">Unify</a>
  <div class="auth-left-content">
    <h1 class="auth-left-title">Own your<br>academic<br><em>journey.</em></h1>
    <p class="auth-left-sub">Track your skills. Showcase your projects. Connect to real opportunities. Build a professional profile before you even graduate.</p>
  </div>
  <p class="auth-left-footer">© 2025 Unify. Own your journey. Build your future.</p>
</div>

<div class="auth-right">
  <div class="auth-tabs">
    <button class="auth-tab active" onclick="switchTab('signin')">Sign In</button>
    <button class="auth-tab" onclick="switchTab('signup')">Sign Up</button>
  </div>

  <div id="errorMsg" class="auth-error"></div>
  <div id="successMsg" class="auth-success"></div>

  <!-- SIGN IN -->
  <form class="auth-form active" id="signinForm" onsubmit="signIn(event)">
    <div>
      <label class="form-label">Email</label>
      <input class="form-input" type="email" id="signinEmail" placeholder="you@email.com" required>
    </div>
    <div>
      <label class="form-label">Password</label>
      <input class="form-input" type="password" id="signinPassword" placeholder="Your password" required>
    </div>
    <button class="btn-submit" type="submit" id="signinBtn">Start Building →</button>
    <div class="divider"><span>or</span></div>
    <button class="btn-google" type="button" onclick="signInWithGoogle()">
      <svg class="google-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>
  </form>

  <!-- SIGN UP -->
  <form class="auth-form" id="signupForm" onsubmit="signUp(event)">
    <div>
      <label class="form-label">Full Name</label>
      <input class="form-input" type="text" id="signupName" placeholder="Your full name" required>
    </div>
    <div>
      <label class="form-label">Email</label>
      <input class="form-input" type="email" id="signupEmail" placeholder="you@email.com" required>
    </div>
    <div>
      <label class="form-label">Password</label>
      <input class="form-input" type="password" id="signupPassword" placeholder="Min. 6 characters" required>
    </div>
    <button class="btn-submit" type="submit" id="signupBtn">Create Account →</button>
    <div class="divider"><span>or</span></div>
    <button class="btn-google" type="button" onclick="signInWithGoogle()">
      <svg class="google-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>
  </form>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, linkWithPopup, GoogleAuthProvider, updateProfile, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBjZyfNNpXZFJwB7GKXVeSzLTVknfwCa8I",
    authDomain: "unify-b4316.firebaseapp.com",
    projectId: "unify-b4316",
    storageBucket: "unify-b4316.firebasestorage.app",
    messagingSenderId: "114594366615",
    appId: "1:114594366615:web:44ef821b4618f1a24615d2",
    measurementId: "G-MY2M1R6DJV"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  // If already logged in → check if onboarded
  onAuthStateChanged(auth, async user => {
    if (!user) return;
    try {
      const snap = await getDoc(doc(db, 'users', user.uid));
      if (snap.exists() && snap.data().university) {
        window.location.href = 'dashboard.html';
      } else {
        window.location.href = 'onboarding.html';
      }
    } catch(e) {
      window.location.href = 'dashboard.html';
    }
  });

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg; el.style.display = 'block';
    document.getElementById('successMsg').style.display = 'none';
  }
  function showSuccess(msg) {
    const el = document.getElementById('successMsg');
    el.textContent = msg; el.style.display = 'block';
    document.getElementById('errorMsg').style.display = 'none';
  }
  function clearMessages() {
    document.getElementById('errorMsg').style.display = 'none';
    document.getElementById('successMsg').style.display = 'none';
  }

  window.switchTab = function(tab) {
    clearMessages();
    document.querySelectorAll('.auth-tab').forEach((t, i) => {
      t.classList.toggle('active', (tab === 'signin' && i === 0) || (tab === 'signup' && i === 1));
    });
    document.getElementById('signinForm').classList.toggle('active', tab === 'signin');
    document.getElementById('signupForm').classList.toggle('active', tab === 'signup');
  }

  window.signIn = async function(e) {
    e.preventDefault(); clearMessages();
    const btn = document.getElementById('signinBtn');
    btn.disabled = true; btn.textContent = 'Signing in...';
    try {
      await signInWithEmailAndPassword(auth,
        document.getElementById('signinEmail').value,
        document.getElementById('signinPassword').value
      );
      window.location.href = 'dashboard.html';
    } catch(err) {
      showError(friendlyError(err.code));
      btn.disabled = false; btn.textContent = 'Sign In →';
    }
  }

  window.signUp = async function(e) {
    e.preventDefault(); clearMessages();
    const btn = document.getElementById('signupBtn');
    btn.disabled = true; btn.textContent = 'Creating account...';
    try {
      const cred = await createUserWithEmailAndPassword(auth,
        document.getElementById('signupEmail').value,
        document.getElementById('signupPassword').value
      );
      // New user → onboarding. Existing user → dashboard
      updateProfile(cred.user, { displayName: document.getElementById('signupName').value });
      window.location.href = 'onboarding.html';
    } catch(err) {
      showError(friendlyError(err.code));
      btn.disabled = false; btn.textContent = 'Create Account →';
    }
  }

  window.signInWithGoogle = async function() {
    clearMessages();
    try {
      await signInWithPopup(auth, provider);
      window.location.href = 'dashboard.html';
    } catch(err) {
      // If this email already exists with email/password, sign them in then link Google
      if (err.code === 'auth/account-exists-with-different-credential') {
        const email = err.customData?.email;
        if (email) {
          showError('This email is registered with a password. Sign in with your password first, then link Google in settings.');
          // Auto-switch to sign in tab and pre-fill email
          switchTab('signin');
          document.getElementById('signinEmail').value = email;
        } else {
          showError('This email is already registered. Please sign in with your password.');
        }
      } else {
        showError(friendlyError(err.code));
      }
    }
  }

  function friendlyError(code) {
    if (code === 'auth/user-not-found') return 'No account found with this email.';
    if (code === 'auth/wrong-password') return 'Incorrect password. Try again.';
    if (code === 'auth/email-already-in-use') return 'An account with this email already exists.';
    if (code === 'auth/weak-password') return 'Password must be at least 6 characters.';
    if (code === 'auth/invalid-email') return 'Please enter a valid email address.';
    if (code === 'auth/popup-closed-by-user') return 'Google sign-in was cancelled.';
    if (code === 'auth/popup-blocked') return 'Popup was blocked. Please allow popups for this site.';
    if (code === 'auth/cancelled-popup-request') return '';
    return 'Something went wrong. Please try again.';
  }
</script>
</body>
</html>
