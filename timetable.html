<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unify — Timetable</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --font-display: 'Playfair Display', serif; --font-body: 'DM Sans', sans-serif;
  --bg: #f5f4f0; --surface: #ffffff; --surface2: #f8f7f3; --border: #e0deda;
  --text: #0a0a0a; --text2: #555; --text3: #999;
  --invert-bg: #0a0a0a; --invert-text: #f5f4f0; --invert-sub: #555; --invert-border: #1f1f1f;
  --green: #4ade80; --green-bg: rgba(74,222,128,0.08); --green-border: rgba(74,222,128,0.25);
  --red: #ef4444; --red-bg: rgba(239,68,68,0.07); --red-border: rgba(239,68,68,0.2);
  --yellow: #fbbf24; --yellow-bg: rgba(251,191,36,0.08); --yellow-border: rgba(251,191,36,0.25);
}
[data-theme="dark"] {
  --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #222; --border: #2a2a2a;
  --text: #f0efeb; --text2: #aaa; --text3: #666;
  --invert-bg: #f0efeb; --invert-text: #0a0a0a; --invert-sub: #aaa; --invert-border: #e0deda;
}
body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 15px; transition: background 0.25s, color 0.25s; }

/* ── NAV ── */
nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 48px; border-bottom: 1px solid var(--border);
  background: var(--bg); position: sticky; top: 0; z-index: 100; height: 60px;
  transition: background 0.25s, border-color 0.25s;
}
.nav-logo { font-family: var(--font-display); font-weight: 900; font-size: 20px; letter-spacing: -1px; text-decoration: none; color: var(--text); }
.nav-links { display: flex; gap: 0; height: 100%; align-items: stretch; }
.nav-link { display: flex; align-items: center; padding: 0 16px; font-size: 13px; font-weight: 500; color: var(--text3); text-decoration: none; border-bottom: 2px solid transparent; transition: all 0.15s; white-space: nowrap; }
.nav-link:hover { color: var(--text); }
.nav-link.active { color: var(--text); border-bottom-color: var(--text); }
.nav-right { display: flex; gap: 10px; align-items: center; }
.theme-toggle { background: none; border: 1px solid var(--border); border-radius: 20px; padding: 5px 14px; font-size: 12px; cursor: pointer; color: var(--text3); font-family: var(--font-body); transition: all 0.15s; }
.theme-toggle:hover { border-color: var(--text); color: var(--text); }
.nav-signout { font-size: 12px; color: var(--text3); background: none; border: 1px solid var(--border); padding: 6px 14px; border-radius: 4px; cursor: pointer; font-family: var(--font-body); transition: all 0.15s; }
.nav-signout:hover { border-color: var(--text); color: var(--text); }

/* ── NOTIFICATION BELL ── */
.notif-bell-btn { position: relative; background: none; border: none; cursor: pointer; color: var(--text3); padding: 6px 8px; border-radius: 8px; display: flex; align-items: center; transition: color .15s; }
.notif-bell-btn:hover { color: var(--text); }
.notif-badge { position: absolute; top: 2px; right: 2px; background: var(--red); color: white; font-size: 9px; font-weight: 700; min-width: 16px; height: 16px; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 0 3px; font-family: var(--font-body); border: 2px solid var(--bg); }

/* ── NOTIFICATION DRAWER ── */
.notif-drawer {
  position: fixed; top: 60px; right: 0; width: 380px; max-width: 100vw;
  background: var(--surface); border-left: 1px solid var(--border); border-bottom: 1px solid var(--border);
  z-index: 300; box-shadow: -4px 8px 32px rgba(0,0,0,0.12);
  transform: translateX(100%); transition: transform .25s ease;
  max-height: calc(100vh - 60px); display: flex; flex-direction: column;
}
.notif-drawer.open { transform: translateX(0); }
.notif-drawer-header {
  padding: 16px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
.notif-drawer-title { font-size: 14px; font-weight: 700; }
.notif-mark-read { font-size: 12px; color: var(--text3); background: none; border: none; cursor: pointer; font-family: var(--font-body); transition: color .15s; }
.notif-mark-read:hover { color: var(--text); }
.notif-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.notif-item {
  padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface2); cursor: default; transition: border-color .15s;
}
.notif-item.unread { border-color: var(--text3); background: var(--surface); }
.notif-item-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
.notif-course-code { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text3); }
.notif-chip { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; letter-spacing: .04em; }
.notif-chip-confirmed { background: var(--green-bg); color: var(--green-deep); border: 1px solid var(--green-border); }
.notif-chip-postponed { background: var(--yellow-bg); color: #92400e; border: 1px solid var(--yellow-border); }
[data-theme="dark"] .notif-chip-postponed { color: var(--yellow); }
.notif-chip-cancelled { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
.notif-chip-venue_change { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
.notif-msg { font-size: 12px; color: var(--text2); line-height: 1.5; }
.notif-meta { font-size: 11px; color: var(--text3); margin-top: 5px; }
.notif-detail { font-size: 11px; color: var(--text3); margin-top: 3px; }
.notif-unread-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); flex-shrink: 0; }
.notif-empty { text-align: center; padding: 40px 20px; color: var(--text3); }
.notif-empty-icon { font-size: 28px; margin-bottom: 10px; opacity: .4; }
.notif-empty-text { font-size: 13px; }
.notif-overlay { display: none; position: fixed; inset: 0; z-index: 299; }
.notif-overlay.active { display: block; }

/* ── MOBILE BOTTOM NAV ── */
.mobile-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); border-top: 1px solid var(--border); z-index: 200; padding: 6px 0 calc(6px + env(safe-area-inset-bottom)); transition: background 0.25s, border-color 0.25s; }
.mobile-nav-inner { display: flex; justify-content: space-around; }
.mobile-nav-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: none; cursor: pointer; font-family: var(--font-body); color: var(--text3); padding: 6px 10px; border-radius: 10px; transition: all 0.15s; text-decoration: none; min-width: 52px; }
.mobile-nav-btn.active { color: var(--text); }
.mobile-nav-label { font-size: 10px; font-weight: 500; }
.mobile-nav-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--text); margin-top: 2px; opacity: 0; transition: opacity 0.15s; }
.mobile-nav-btn.active .mobile-nav-dot { opacity: 1; }
@media (max-width: 768px) {
  nav { padding: 0 16px; }
  .nav-links { display: none; }
  .mobile-nav { display: block; }
  body { padding-bottom: 76px; }
}

/* ── PAGE HEADER ── */
.page-header {
  background: var(--invert-bg); color: var(--invert-text);
  padding: 32px 48px; display: flex; align-items: flex-end;
  justify-content: space-between; gap: 24px; flex-wrap: wrap;
  transition: background 0.25s;
}
.page-header-left {}
.page-title { font-family: var(--font-display); font-size: clamp(24px, 2.5vw, 36px); font-weight: 900; letter-spacing: -1px; margin-bottom: 6px; }
.page-sub { font-size: 13px; color: var(--invert-sub); }
.today-date { font-size: 13px; color: var(--invert-sub); text-align: right; }
.today-day { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--invert-text); letter-spacing: -0.5px; }

/* ── TODAY BANNER ── */
.today-banner {
  background: var(--yellow-bg); border-bottom: 1px solid var(--yellow-border);
  padding: 12px 48px; display: flex; align-items: center; gap: 12px;
  font-size: 13px; color: var(--text2);
}
.today-banner-icon { font-size: 16px; }
.today-banner strong { color: var(--text); }
.today-classes-count {
  margin-left: auto; font-size: 12px; color: var(--text3);
  background: var(--surface); border: 1px solid var(--border);
  padding: 3px 12px; border-radius: 10px;
}

/* ── DAY TABS ── */
.day-tabs-wrap { padding: 0 48px; border-bottom: 1px solid var(--border); background: var(--bg); position: sticky; top: 60px; z-index: 90; transition: background 0.25s; }
.day-tabs { display: flex; gap: 0; overflow-x: auto; }
.day-tab {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 14px 20px; cursor: pointer; border-bottom: 2px solid transparent;
  transition: all 0.15s; background: none; border-top: none; border-left: none;
  border-right: none; font-family: var(--font-body); color: var(--text3);
  white-space: nowrap; min-width: 80px;
}
.day-tab:hover { color: var(--text); }
.day-tab.active { color: var(--text); border-bottom-color: var(--text); }
.day-tab.today { color: var(--text); }
.day-tab-name { font-size: 13px; font-weight: 600; }
.day-tab-date { font-size: 10px; color: var(--text3); }
.day-tab.today .day-tab-date { color: var(--yellow); }
.day-tab-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--yellow); margin-top: 2px; opacity: 0; }
.day-tab.today .day-tab-dot { opacity: 1; }

/* ── TIMETABLE BODY ── */
.timetable-body { padding: 28px 48px; max-width: 860px; }

/* LEGEND */
.legend { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text3); }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; }
.legend-dot.scheduled { background: var(--border); }
.legend-dot.confirmed { background: var(--green); }
.legend-dot.cancelled { background: var(--red); }
.legend-dot.ongoing { background: var(--yellow); }

/* CLASS CARDS */
.classes-list { display: flex; flex-direction: column; gap: 10px; }

.class-card {
  border: 1px solid var(--border); border-radius: 14px;
  background: var(--surface); overflow: hidden;
  transition: all 0.2s; position: relative;
  animation: slideIn 0.3s ease both;
}
@keyframes slideIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
.class-card:nth-child(1) { animation-delay: 0.03s; }
.class-card:nth-child(2) { animation-delay: 0.07s; }
.class-card:nth-child(3) { animation-delay: 0.11s; }
.class-card:nth-child(4) { animation-delay: 0.15s; }
.class-card:nth-child(5) { animation-delay: 0.19s; }
.class-card:nth-child(n+6) { animation-delay: 0.23s; }

.class-card.confirmed { border-color: var(--green-border); background: var(--green-bg); }
.class-card.cancelled { border-color: var(--red-border); background: var(--red-bg); opacity: 0.7; }
.class-card.ongoing { border-color: var(--yellow-border); background: var(--yellow-bg); box-shadow: 0 0 0 3px rgba(251,191,36,0.1); }

/* STATUS STRIP */
.class-status-strip { height: 4px; width: 100%; }
.class-card .class-status-strip { background: var(--border); }
.class-card.confirmed .class-status-strip { background: var(--green); }
.class-card.cancelled .class-status-strip { background: var(--red); }
.class-card.ongoing .class-status-strip { background: var(--yellow); }

.class-inner { padding: 16px 20px; display: flex; align-items: flex-start; gap: 16px; }

/* TIME COLUMN */
.class-time-col { flex-shrink: 0; text-align: center; min-width: 56px; }
.class-time-start { font-family: var(--font-display); font-size: 18px; font-weight: 700; letter-spacing: -0.5px; line-height: 1; }
.class-time-end { font-size: 11px; color: var(--text3); margin-top: 2px; }
.class-duration { font-size: 10px; color: var(--text3); background: var(--surface2); border: 1px solid var(--border); padding: 2px 6px; border-radius: 6px; margin-top: 4px; display: inline-block; }

/* DIVIDER */
.class-divider { width: 1px; background: var(--border); align-self: stretch; flex-shrink: 0; }
.class-card.confirmed .class-divider { background: var(--green-border); }
.class-card.cancelled .class-divider { background: var(--red-border); }

/* INFO COLUMN */
.class-info { flex: 1; min-width: 0; }
.class-code { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text3); margin-bottom: 3px; font-weight: 500; }
.class-name { font-size: 15px; font-weight: 700; margin-bottom: 5px; line-height: 1.3; }
.class-card.cancelled .class-name { text-decoration: line-through; opacity: 0.6; }
.class-meta { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--text3); margin-bottom: 10px; }
.class-meta-item { display: flex; align-items: center; gap: 4px; }
.class-status-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 10px;
  letter-spacing: 0.3px;
}
.badge-scheduled { background: var(--surface2); color: var(--text3); border: 1px solid var(--border); }
.badge-confirmed { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
.badge-cancelled { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
.badge-ongoing { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
.status-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

/* ACTIONS */
.class-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.class-action-btn {
  font-size: 11px; padding: 5px 12px; border-radius: 6px; cursor: pointer;
  font-family: var(--font-body); transition: all 0.15s; font-weight: 500;
  border: 1px solid var(--border); background: none; color: var(--text3);
}
.class-action-btn:hover { border-color: var(--text); color: var(--text); }
.class-action-btn.confirm { border-color: var(--green-border); color: var(--green); background: var(--green-bg); }
.class-action-btn.confirm:hover { background: var(--green); color: #0a0a0a; border-color: var(--green); }
.class-action-btn.cancel { border-color: var(--red-border); color: var(--red); }
.class-action-btn.cancel:hover { background: var(--red-bg); }
.class-action-btn.undo { border-color: var(--border); color: var(--text3); }

/* NOTE */
.class-note { font-size: 12px; color: var(--text3); font-style: italic; margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--border); }
.class-card.confirmed .class-note { border-color: var(--green-border); }
.class-card.cancelled .class-note { border-color: var(--red-border); }

/* EMPTY DAY */
.empty-day { text-align: center; padding: 60px 24px; color: var(--text3); }
.empty-day-icon { font-size: 36px; margin-bottom: 12px; opacity: 0.25; }
.empty-day-text { font-size: 14px; line-height: 1.8; }

/* ADD CLASS FORM */
.add-class-section { margin-top: 28px; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: var(--surface); }
.add-class-toggle { width: 100%; padding: 14px 20px; background: none; border: none; cursor: pointer; font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--text3); text-align: left; display: flex; align-items: center; gap: 8px; transition: color 0.15s; }
.add-class-toggle:hover { color: var(--text); }
.add-class-form { padding: 20px; border-top: 1px solid var(--border); display: none; }
.add-class-form.open { display: block; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-label { font-size: 11px; color: var(--text3); }
.form-input, .form-select { padding: 9px 12px; border: 1px solid var(--border); border-radius: 6px; font-family: var(--font-body); font-size: 13px; background: var(--bg); color: var(--text); outline: none; transition: border-color 0.15s; }
.form-input:focus, .form-select:focus { border-color: var(--text); }
.form-input::placeholder { color: var(--text3); }
.add-btn { padding: 10px 22px; background: var(--text); color: var(--bg); border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--font-body); transition: opacity 0.15s; }
.add-btn:hover { opacity: 0.8; }

/* TOAST */
.toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(120px); background: var(--text); color: var(--bg); padding: 12px 24px; border-radius: 50px; font-size: 13px; font-weight: 500; transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1); z-index: 999; white-space: nowrap; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
.toast.show { transform: translateX(-50%) translateY(0); }
@media (max-width: 768px) { .toast { bottom: 90px; } }

/* ADMIN BADGE */
.admin-badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: rgba(74,222,128,0.12); color: var(--green); border: 1px solid var(--green-border); letter-spacing: .06em; text-transform: uppercase; }

/* ADMIN EDIT BUTTON */
.class-action-btn.edit-class { border-color: rgba(99,102,241,.3); color: #6366f1; background: rgba(99,102,241,.06); }
.class-action-btn.edit-class:hover { background: rgba(99,102,241,.14); border-color: #6366f1; }

/* EDIT MODAL */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 500; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.open { display: flex; }
.modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 480px; overflow: hidden; box-shadow: 0 24px 64px rgba(0,0,0,0.18); animation: modalIn .2s ease; }
@keyframes modalIn { from { opacity:0; transform:scale(.96) translateY(8px); } to { opacity:1; transform:scale(1) translateY(0); } }
.modal-header { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.modal-title { font-size: 15px; font-weight: 700; }
.modal-close { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 18px; line-height: 1; padding: 4px; border-radius: 6px; transition: color .15s; }
.modal-close:hover { color: var(--text); }
.modal-body { padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.modal-course-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--text3); background: var(--surface2); border: 1px solid var(--border); padding: 4px 10px; border-radius: 6px; }
.modal-field { display: flex; flex-direction: column; gap: 4px; }
.modal-label { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; }
.modal-input, .modal-select, .modal-textarea { padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-family: var(--font-body); font-size: 13px; background: var(--bg); color: var(--text); outline: none; transition: border-color .15s; width: 100%; }
.modal-input:focus, .modal-select:focus, .modal-textarea:focus { border-color: var(--text); }
.modal-textarea { resize: vertical; min-height: 72px; }
.modal-footer { padding: 16px 22px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }
.modal-btn { padding: 9px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--font-body); transition: all .15s; border: 1px solid var(--border); background: none; color: var(--text3); }
.modal-btn:hover { border-color: var(--text); color: var(--text); }
.modal-btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.modal-btn.primary:hover { opacity: .8; }
.modal-btn.primary:disabled { opacity: .5; cursor: default; }

/* LOADING */
.loading-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 999; flex-direction: column; gap: 14px; }
.loading-logo { font-family: var(--font-display); font-size: 30px; font-weight: 900; letter-spacing: -1px; }
.loading-sub { font-size: 13px; color: var(--text3); }

@media (max-width: 768px) {
  .page-header { padding: 24px 20px; }
  .today-banner { padding: 12px 20px; }
  .day-tabs-wrap { padding: 0 16px; }
  .timetable-body { padding: 20px 16px; }
}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-logo">Unify</div>
  <div class="loading-sub">Loading your timetable...</div>
</div>
<div class="toast" id="toast"></div>

<!-- COURSE REP / ADMIN EDIT MODAL -->
<div class="modal-overlay" id="editModal" onclick="handleModalOverlayClick(event)">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">Edit Course Info</span>
      <button class="modal-close" onclick="closeEditModal()">✕</button>
    </div>
    <div class="modal-body">
      <div><span class="modal-course-chip" id="editModalCourseChip">—</span></div>
      <div class="modal-field">
        <label class="modal-label">Class Status</label>
        <select class="modal-select" id="editStatus">
          <option value="scheduled">Scheduled (pending)</option>
          <option value="confirmed">Confirmed — class is holding</option>
          <option value="cancelled">Cancelled — class won't hold</option>
          <option value="postponed">Postponed — TBD</option>
          <option value="venue_change">Venue change only</option>
        </select>
      </div>
      <div class="modal-field">

const app = initializeApp(firebaseConfig);

// ── THEME ─────────────────────────────────────────────
function initTheme() {
  const saved = localStorage.getItem('unify-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved || (prefersDark ? 'dark' : 'light'));
}
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('themeToggle');
  if (btn) btn.textContent = theme === 'dark' ? '☀️ Light' : '🌙 Dark';
}
window.toggleTheme = function() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  localStorage.setItem('unify-theme', next);
  applyTheme(next);
}
initTheme();

// ── AUTH ──────────────────────────────────────────────
onAuthStateChanged(auth, async user => {
  if (!user) { window.location.href = 'auth.html'; return; }
  currentUser = user;
  await loadData();
  initPage();
  document.getElementById('loadingOverlay').style.display = 'none';
});

document.getElementById('signOutBtn').addEventListener('click', async () => {
  await signOut(auth); window.location.href = 'auth.html';
});

// ── LOAD DATA ─────────────────────────────────────────
async function loadData() {
  try {
    const snap = await getDoc(doc(db, 'users', currentUser.uid));
    if (snap.exists()) {
      const d = snap.data();
      userProfile = d;
      timetable = d.timetable || getDefaultTimetable(d.department, d.level);
      isAdminUser = d.isAdmin === true || d.isCourseRep === true;
      if (isAdminUser) {
        const badge = document.getElementById('adminBadge');
        if (badge) badge.style.display = 'inline-flex';
      }
    }
  } catch(e) {
    timetable = getDefaultTimetable('', '');
  }

  // Course updates are handled live by subscribeNotifications() below
  subscribeNotifications();
}

// ── NOTIFICATION BELL ─────────────────────────────────
let unreadCount = 0;

function subscribeNotifications() {
  // Listen to courseUpdates — the collection admin.html writes to
  const q = query(collection(db, 'courseUpdates'), orderBy('postedAt', 'desc'));

  onSnapshot(q, snap => {
    const myCourseCodes = [];
    Object.values(timetable).forEach(day => {
      day.forEach(cls => { if (cls.code && !myCourseCodes.includes(cls.code)) myCourseCodes.push(cls.code); });
    });

    // Show all updates for courses in this student's timetable
    const updates = snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .filter(u => !myCourseCodes.length || myCourseCodes.includes(u.courseCode));

    const readIds = JSON.parse(localStorage.getItem('unify-read-notifs') || '[]');
    unreadCount = updates.filter(u => !readIds.includes(u.id)).length;
    updateBell(unreadCount);
    renderNotifDrawer(updates.slice(0, 30), readIds);

    // Also merge latest courseStatus into timetable cards (live updates)
    updates.forEach(u => {
      if (!u.courseCode) return;
      Object.keys(timetable).forEach(day => {
        timetable[day] = timetable[day].map(cls => {
          if (cls.code !== u.courseCode) return cls;
          return {
            ...cls,
            lecturer: u.lecturer || cls.lecturer,
            location: u.venue || cls.location,
            status: ['confirmed','postponed','cancelled'].includes(u.status) ? u.status : cls.status,
            adminMessage: u.message || cls.adminMessage || '',
            adminUpdated: true,
          };
        });
      });
    });
    renderClasses();
  });
}

function updateBell(count) {
  const bell = document.getElementById('notifBell');
  const badge = document.getElementById('notifBadge');
  if (!bell || !badge) return;
  if (count > 0) {
    badge.textContent = count > 9 ? '9+' : count;
    badge.style.display = 'flex';
  } else {
    badge.style.display = 'none';
  }
}

function renderNotifDrawer(updates, readIds) {
  const list = document.getElementById('notifList');
  if (!list) return;
  if (!updates.length) {
    list.innerHTML = `<div class="notif-empty"><div class="notif-empty-icon">🔔</div><div class="notif-empty-text">No updates for your courses yet.</div></div>`;
    return;
  }

  const chipClass = { confirmed:'notif-chip-confirmed', postponed:'notif-chip-postponed', cancelled:'notif-chip-cancelled', venue_change:'notif-chip-venue_change' };
  const chipLabel = { confirmed:'Confirmed', postponed:'Postponed', cancelled:'Cancelled', venue_change:'Venue Change' };

  list.innerHTML = updates.map(u => {
    const isUnread = !readIds.includes(u.id);
    const ts = u.postedAt?.toDate();
    const timeStr = ts ? ts.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + ' · ' + ts.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : '';
    const chip = `<span class="notif-chip ${chipClass[u.status]||'notif-chip-venue_change'}">${chipLabel[u.status]||u.status}</span>`;
    const details = [u.lecturer?`Lecturer: ${u.lecturer}`:null, u.venue?`Venue: ${u.venue}`:null].filter(Boolean).join(' · ');

    return `<div class="notif-item ${isUnread?'unread':''}" onclick="markRead('${u.id}')">
      <div class="notif-item-top">
        <span class="notif-course-code">${u.courseCode}</span>
        <div style="display:flex;align-items:center;gap:6px;">
          ${chip}
          ${isUnread ? '<div class="notif-unread-dot"></div>' : ''}
        </div>
      </div>
      ${u.message ? `<div class="notif-msg">${u.message}</div>` : ''}
      ${details ? `<div class="notif-detail">${details}</div>` : ''}
      <div class="notif-meta">Posted by ${u.postedBy||'Admin'} · ${timeStr}</div>
    </div>`;
  }).join('');
}

window.markRead = function(id) {
  const readIds = JSON.parse(localStorage.getItem('unify-read-notifs') || '[]');
  if (!readIds.includes(id)) readIds.push(id);
  localStorage.setItem('unify-read-notifs', JSON.stringify(readIds));
  updateBell(Math.max(0, unreadCount - 1));
};

window.markAllRead = function() {
  const list = document.getElementById('notifList');
  const ids = Array.from(list.querySelectorAll('.notif-item')).map(el => {
    const m = el.getAttribute('onclick')?.match(/'([^']+)'/);
    return m ? m[1] : null;
  }).filter(Boolean);
  const readIds = JSON.parse(localStorage.getItem('unify-read-notifs') || '[]');
  ids.forEach(id => { if (!readIds.includes(id)) readIds.push(id); });
  localStorage.setItem('unify-read-notifs', JSON.stringify(readIds));
  unreadCount = 0;
  updateBell(0);
  list.querySelectorAll('.notif-item').forEach(el => { el.classList.remove('unread'); });
  list.querySelectorAll('.notif-unread-dot').forEach(el => el.remove());
};

window.toggleNotifDrawer = function() {
  const drawer = document.getElementById('notifDrawer');
  const overlay = document.getElementById('notifOverlay');
  const isOpen = drawer.classList.toggle('open');
  overlay.classList.toggle('active', isOpen);
};

window.closeNotifDrawer = function() {
  document.getElementById('notifDrawer')?.classList.remove('open');
  document.getElementById('notifOverlay')?.classList.remove('active');
};

function saveData() {
  if (!currentUser) return;
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async () => {
    try {
      await setDoc(doc(db, 'users', currentUser.uid), { timetable }, { merge: true });
    } catch(e) { console.error(e); }
  }, 800);
}

function guessDeptKey(dept) {
  if (!dept) return 'ECE';
  const d = dept.toUpperCase();
  if (d.includes('ELECTRICAL') || d.includes('ECE') || d.includes('COMPUTER')) return 'ECE';
  if (d.includes('MECHANICAL') || d.includes('MEE')) return 'MEE';
  if (d.includes('AEROSPACE') || d.includes('ASE')) return 'ASE';
  if (d.includes('CHEMICAL') || d.includes('CPE')) return 'CPE';
  if (d.includes('INDUSTRIAL') || d.includes('IPE')) return 'IPE';
  if (d.includes('CIVIL') || d.includes('CVE')) return 'CVE';
  return 'ECE';
}

function getDefaultTimetable(dept, level) {
  const lvlKey = level ? level.replace(/\D/g, '').slice(0, 3) : '300';
  const deptKey = guessDeptKey(dept);
  return (TIMETABLES[deptKey] && TIMETABLES[deptKey][lvlKey]) || TIMETABLES['ECE']['300'];
}

// ── INIT PAGE ─────────────────────────────────────────
function initPage() {
  const now = new Date();
  const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const todayName = dayNames[now.getDay()];
  activeDay = DAYS.includes(todayName) ? todayName : 'Monday';

  document.getElementById('todayDayDisplay').textContent = now.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
  document.getElementById('todayDateSub').textContent = 'Today';
  document.getElementById('headerSub').textContent = `${userProfile.department || 'Engineering'} · ${userProfile.level || '300 Level'}`;

  // Today banner
  const todayClasses = (timetable[activeDay] || []).filter(c => c.status !== 'cancelled');
  if (todayClasses.length === 0) {
    document.getElementById('todayBannerText').textContent = 'No classes today — enjoy the break!';
    document.getElementById('todayClassesCount').textContent = 'Free day';
  } else {
    const confirmed = todayClasses.filter(c => c.status === 'confirmed').length;
    document.getElementById('todayBannerText').textContent =
      confirmed > 0
        ? `${confirmed} class${confirmed > 1 ? 'es' : ''} confirmed today`
        : `${todayClasses.length} class${todayClasses.length > 1 ? 'es' : ''} scheduled today`;
    document.getElementById('todayClassesCount').textContent = `${todayClasses.length} classes`;
  }

  renderDayTabs();
  renderClasses();
}

// ── DAY TABS ──────────────────────────────────────────
function renderDayTabs() {
  const now = new Date();
  const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const todayName = dayNames[now.getDay()];

  document.getElementById('dayTabs').innerHTML = DAYS.map(day => {
    const isToday = day === todayName;
    const isActive = day === activeDay;
    const classes = (timetable[day] || []).filter(c => c.status !== 'cancelled');
    return `<button class="day-tab ${isActive ? 'active' : ''} ${isToday ? 'today' : ''}"
      onclick="switchDay('${day}')">
      <span class="day-tab-name">${day.slice(0,3)}</span>
      <span class="day-tab-date">${classes.length} class${classes.length !== 1 ? 'es' : ''}</span>
      <div class="day-tab-dot"></div>
    </button>`;
  }).join('');
}

window.switchDay = function(day) {
  activeDay = day;
  renderDayTabs();
  renderClasses();
}

// ── RENDER CLASSES ────────────────────────────────────
function renderClasses() {
  const list = document.getElementById('classesList');
  const classes = (timetable[activeDay] || []).sort((a,b) => a.start.localeCompare(b.start));

  if (!classes.length) {
    list.innerHTML = `<div class="empty-day">
      <div class="empty-day-icon">😴</div>
      <p class="empty-day-text">No classes on ${activeDay}.<br>Use the form below to add one.</p>
    </div>`;
    return;
  }

  const now = new Date();
  const nowMins = now.getHours() * 60 + now.getMinutes();
  const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const isToday = activeDay === dayNames[now.getDay()];

  list.innerHTML = classes.map(cls => {
    const startMins = timeToMins(cls.start);
    const endMins = timeToMins(cls.end);
    const isOngoing = isToday && nowMins >= startMins && nowMins < endMins && cls.status !== 'cancelled';
    const displayStatus = cls.status === 'cancelled' ? 'cancelled' : isOngoing ? 'ongoing' : cls.status;
    const duration = endMins - startMins;
    const durationText = duration >= 60 ? Math.floor(duration/60) + 'h' + (duration%60 ? (duration%60)+'m' : '') : duration + 'min';

    const badgeMap = {
      scheduled: '<span class="class-status-badge badge-scheduled"><div class="status-dot"></div>Scheduled</span>',
      confirmed: '<span class="class-status-badge badge-confirmed"><div class="status-dot"></div>Confirmed</span>',
      cancelled: '<span class="class-status-badge badge-cancelled"><div class="status-dot"></div>Cancelled</span>',
      ongoing: '<span class="class-status-badge badge-ongoing"><div class="status-dot"></div>Ongoing now</span>',
      postponed: '<span class="class-status-badge" style="background:rgba(251,191,36,.12);color:#b45309;border:1px solid rgba(251,191,36,.3);"><div class="status-dot" style="background:#b45309;"></div>Postponed</span>',
      rescheduled: '<span class="class-status-badge" style="background:rgba(59,130,246,.1);color:#2563eb;border:1px solid rgba(59,130,246,.25);"><div class="status-dot" style="background:#2563eb;"></div>Rescheduled</span>',
    };

    const editBtn = isAdminUser
      ? `<button class="class-action-btn edit-class" onclick="openEditModal('${cls.id}','${activeDay}')">✏ Edit</button>`
      : '';
    const confirmBtn = `<button class="class-action-btn confirm" onclick="updateStatus('${cls.id}','confirmed')">✓ Confirm</button>`;
    const cancelBtn  = `<button class="class-action-btn cancel"  onclick="updateStatus('${cls.id}','cancelled')">✕ Cancel</button>`;
    const pendingBtn = `<button class="class-action-btn undo"    onclick="updateStatus('${cls.id}','scheduled')">⏸ Pending</button>`;
    let actions;
    if (cls.status === 'confirmed') {
      actions = pendingBtn + cancelBtn + editBtn;
    } else if (cls.status === 'cancelled') {
      actions = pendingBtn + confirmBtn + editBtn;
    } else {
      // scheduled / postponed / anything else → pending is the current state
      actions = confirmBtn + cancelBtn + editBtn;
    }

    return `<div class="class-card ${displayStatus}" id="card-${cls.id}">
      <div class="class-status-strip"></div>
      <div class="class-inner">
        <div class="class-time-col">
          <div class="class-time-start">${formatTime(cls.start)}</div>
          <div class="class-time-end">${formatTime(cls.end)}</div>
          <span class="class-duration">${durationText}</span>
        </div>
        <div class="class-divider"></div>
        <div class="class-info">
          <div class="class-code">${cls.code}</div>
          <div class="class-name">${cls.name}</div>
          <div class="class-meta">
            ${cls.lecturer ? `<span class="class-meta-item">👤 ${cls.lecturer}</span>` : ''}
            ${cls.location ? `<span class="class-meta-item">📍 ${cls.location}</span>` : ''}
          </div>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            ${badgeMap[displayStatus]}
            <div class="class-actions">${actions}</div>
          </div>
          ${cls.note ? `<div class="class-note">📝 ${cls.note}</div>` : ''}
          ${cls.adminMessage ? `<div style="margin-top:8px;padding:10px 14px;background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.25);border-radius:8px;font-size:12px;line-height:1.6;color:var(--text2);"><span style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#16a34a;display:block;margin-bottom:4px;">HOC Update</span>${cls.adminMessage}</div>` : ''}
          ${cls.rescheduleTime ? `<div style="margin-top:6px;font-size:12px;color:#2563eb;font-weight:500;">🔄 Rescheduled to: ${cls.rescheduleTime}</div>` : ''}
          ${['postponed','rescheduled'].includes(cls.status) ? `<div style="margin-top:6px;padding:8px 12px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);border-radius:6px;font-size:12px;color:#b45309;">Check the notification bell for details.</div>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── UPDATE STATUS ─────────────────────────────────────
window.updateStatus = function(id, newStatus) {
  const dayClasses = timetable[activeDay] || [];
  const cls = dayClasses.find(c => c.id === id);
  if (!cls) return;
  cls.status = newStatus;
  renderClasses();
  saveData();
  const msgs = {
    confirmed: '✅ Class confirmed — it\'s happening!',
    cancelled: '❌ Class marked as cancelled.',
    scheduled: '⏸ Class set back to pending.',
  };
  showToast(msgs[newStatus] || 'Updated');
}

// ── ADD CLASS ─────────────────────────────────────────
window.toggleAddForm = function() {
  const form = document.getElementById('addClassForm');
  form.classList.toggle('open');
}

window.addClass = function() {
  const code = document.getElementById('newCode').value.trim();
  const name = document.getElementById('newName').value.trim();
  const day = document.getElementById('newDay').value;
  const start = document.getElementById('newStart').value;
  const end = document.getElementById('newEnd').value;
  const lecturer = document.getElementById('newLecturer').value.trim();
  const location = document.getElementById('newLocation').value.trim();
  if (!code || !name) { showToast('Course code and name are required'); return; }

  const newClass = {
    id: day[0].toLowerCase() + Date.now(),
    code, name, start, end, lecturer, location,
    status: 'scheduled', note: ''
  };
  if (!timetable[day]) timetable[day] = [];
  timetable[day].push(newClass);

  activeDay = day;
  renderDayTabs();
  renderClasses();
  saveData();
  toggleAddForm();
  ['newCode','newName','newLecturer','newLocation'].forEach(id => document.getElementById(id).value = '');
  showToast('📅 Class added to ' + day);
}

// ── HELPERS ───────────────────────────────────────────
function timeToMins(t) {
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}
function formatTime(t) {
  const [h, m] = t.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  const hr = h % 12 || 12;
  return `${hr}:${m.toString().padStart(2,'0')} ${ampm}`;
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ── ADMIN / COURSE REP EDIT MODAL ────────────────────
window.openEditModal = function(id, day) {
  const dayClasses = timetable[day] || [];
  const cls = dayClasses.find(c => c.id === id);
  if (!cls) return;
  editingClass = { cls, day };
  document.getElementById('editModalCourseChip').textContent = `${cls.code} · ${day}`;
  document.getElementById('editStatus').value =
    ['scheduled','confirmed','cancelled','postponed','venue_change'].includes(cls.status) ? cls.status : 'scheduled';
  document.getElementById('editLecturer').value = cls.lecturer || '';
  document.getElementById('editVenue').value = cls.location || '';
  document.getElementById('editMessage').value = '';
  document.getElementById('editModal').classList.add('open');
};

window.closeEditModal = function() {
  document.getElementById('editModal').classList.remove('open');
  editingClass = null;
};

window.handleModalOverlayClick = function(e) {
  if (e.target === document.getElementById('editModal')) closeEditModal();
};

window.submitCourseUpdate = async function() {
  if (!editingClass || !currentUser) return;
  const { cls, day } = editingClass;
  const status   = document.getElementById('editStatus').value;
  const lecturer = document.getElementById('editLecturer').value.trim();
  const venue    = document.getElementById('editVenue').value.trim();
  const message  = document.getElementById('editMessage').value.trim();

  const btn = document.getElementById('editSubmitBtn');
  btn.disabled = true;
  btn.textContent = 'Posting...';

  try {
    const updateId = `${cls.code.replace(/\s/g,'-')}_${Date.now()}`;
    const payload = {
      courseCode: cls.code,
      status,
      lecturer: lecturer || null,
      venue: venue || null,
      message: message || null,
      postedAt: serverTimestamp(),
      postedBy: userProfile?.name || currentUser.email,
      postedByEmail: currentUser.email,
    };
    await setDoc(doc(db, 'courseUpdates', updateId), payload);

    // Update local copy immediately so the card reflects the change
    if (lecturer) cls.lecturer = lecturer;
    if (venue) cls.location = venue;
    if (message) cls.adminMessage = message;
    if (['confirmed','cancelled','postponed'].includes(status)) cls.status = status;
    else if (status === 'scheduled') cls.status = 'scheduled';
    saveData();
    renderClasses();

    closeEditModal();
    showToast('✅ Update posted to all students');
  } catch(e) {
    console.error(e);
    showToast('❌ Failed to post update');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Post Update →';
  }
};

// ── SERVICE WORKER (Push Notifications) ───────────────
async function registerServiceWorker() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    const reg = await navigator.serviceWorker.register('/sw.js');
    console.log('Unify SW registered:', reg.scope);

    // Request notification permission
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') return;

    // Store subscription in Firestore for server-side push (future)
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(
        // Replace with your VAPID public key when setting up Web Push server
        'BEl62iUYgUivxIkv69yViEuiBIa-Ib9-SkvMeAtA3LFgDzkrxZJjSgSnfckjBJuBkr3qBrqLTkVSmeZWZoRkU'
      )
    }).catch(() => null);

    if (sub && currentUser) {
      await setDoc(doc(db, 'users', currentUser.uid), {
        pushSubscription: JSON.stringify(sub)
      }, { merge: true });
    }
  } catch(e) {
    console.log('SW registration skipped:', e.message);
  }
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = window.atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) { outputArray[i] = rawData.charCodeAt(i); }
  return outputArray;
}

// Register SW after auth
setTimeout(registerServiceWorker, 2000);
