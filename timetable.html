<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a0a0a">
<link rel="apple-touch-icon" href="/icons/icon.svg">
<title>Unify — Timetable</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
<script src="js/theme.js"></script>

    <link rel="stylesheet" href="css/pages/timetable.styles.css">
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-logo">Unify</div>
  <div class="loading-sub">Loading your timetable...</div>
</div>
<div class="toast" id="toast"></div>


<!-- COURSE REP / ADMIN EDIT MODAL -->
<div class="modal-overlay" id="editModal" onclick="handleModalOverlayClick(event)">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">Edit Course Info</span>
      <button class="modal-close" onclick="closeEditModal()">✕</button>
    </div>
    <div class="modal-body">
      <div><span class="modal-course-chip" id="editModalCourseChip">—</span></div>
      <div class="modal-field">
        <label class="modal-label">Class Status</label>
        <select class="modal-select" id="editStatus">
          <option value="scheduled">Scheduled (pending)</option>
          <option value="confirmed">Confirmed — class is holding</option>
          <option value="cancelled">Cancelled — class won't hold</option>
          <option value="postponed">Postponed — TBD</option>
          <option value="venue_change">Venue change only</option>
        </select>
      </div>
      <div class="modal-field">
        <label class="modal-label">Lecturer (leave blank to keep unchanged)</label>
        <input class="modal-input" id="editLecturer" placeholder="e.g. Dr. Adeyemi">
      </div>
      <div class="modal-field">
        <label class="modal-label">Venue (leave blank to keep unchanged)</label>
        <input class="modal-input" id="editVenue" placeholder="e.g. ECE Block, LT2">
      </div>
      <div class="modal-field">
        <label class="modal-label">Message to students (optional)</label>
        <textarea class="modal-textarea" id="editMessage" placeholder="e.g. Class starts 30 minutes late. Bring your lab sheets."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="modal-btn" onclick="closeEditModal()">Cancel</button>
      <button class="modal-btn primary" id="editSubmitBtn" onclick="submitCourseUpdate()">Post Update →</button>
    </div>
  </div>
</div>

<!-- NAV -->
<nav>
  <a href="index.html" class="nav-logo">Unify</a>
  <div class="nav-links">
    <a href="dashboard.html" class="nav-link">Dashboard</a>
    <a href="timetable.html" class="nav-link active">Timetable</a>
    <a href="profile.html" class="nav-link">Profile</a>
  </div>
  <div class="nav-right">
    <button class="notif-bell-btn" id="notifBell" onclick="toggleNotifDrawer()" title="Notifications">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="notif-badge" id="notifBadge" style="display:none;"></span>
    </button>
    <span class="admin-badge" id="adminBadge" style="display:none;">Course Rep</span>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle">🌙 Dark</button>
    <button class="nav-signout" id="signOutBtn">Sign out</button>
  </div>
</nav>

<!-- NOTIFICATION OVERLAY -->
<div class="notif-overlay" id="notifOverlay" onclick="closeNotifDrawer()"></div>

<!-- NOTIFICATION DRAWER -->
<div class="notif-drawer" id="notifDrawer">
  <div class="notif-drawer-header">
    <span class="notif-drawer-title">Course Updates</span>
    <button class="notif-mark-read" onclick="markAllRead()">Mark all read</button>
  </div>
  <div class="notif-list" id="notifList">
    <div class="notif-empty">
      <div class="notif-empty-icon">🔔</div>
      <div class="notif-empty-text">No updates yet.</div>
    </div>
  </div>
</div>

<!-- PAGE HEADER -->
<div class="page-header">
  <div class="page-header-left">
    <div class="page-title">Class Timetable</div>
    <div class="page-sub" id="headerSub">Your schedule for the semester</div>
  </div>
  <div style="text-align:right;">
    <div class="today-date" id="todayDateSub">Today</div>
    <div class="today-day" id="todayDayDisplay">—</div>
  </div>
</div>

<div id="timetableSourceNote" style="display:none;font-size:12px;color:var(--text3);padding:6px 0 2px;"></div>

<!-- TODAY BANNER -->
<div class="today-banner" id="todayBanner">
  <span class="today-banner-icon">📍</span>
  <span><strong id="todayBannerText">Loading today's classes...</strong></span>
  <span class="today-classes-count" id="todayClassesCount">—</span>
</div>

<!-- DAY TABS -->
<div class="day-tabs-wrap">
  <div class="day-tabs" id="dayTabs"></div>
</div>

<!-- TIMETABLE BODY -->
<div class="timetable-body">
  <div class="legend">
    <div class="legend-item"><div class="legend-dot scheduled"></div> Scheduled</div>
    <div class="legend-item"><div class="legend-dot ongoing"></div> Ongoing now</div>
    <div class="legend-item"><div class="legend-dot confirmed"></div> Confirmed</div>
    <div class="legend-item"><div class="legend-dot cancelled"></div> Cancelled</div>
  </div>
  <div class="classes-list" id="classesList"></div>

  <!-- ADD CLASS -->
  <div class="add-class-section">
    <button class="add-class-toggle" onclick="toggleAddForm()">
      <span>＋</span> Add a class manually
    </button>
    <div class="add-class-form" id="addClassForm">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Course Code *</label>
          <input class="form-input" id="newCode" placeholder="e.g. ECE 301">
        </div>
        <div class="form-group">
          <label class="form-label">Course Name *</label>
          <input class="form-input" id="newName" placeholder="e.g. Signals &amp; Systems">
        </div>
        <div class="form-group">
          <label class="form-label">Day</label>
          <select class="form-select" id="newDay">
            <option>Monday</option><option>Tuesday</option><option>Wednesday</option>
            <option>Thursday</option><option>Friday</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Lecturer</label>
          <input class="form-input" id="newLecturer" placeholder="e.g. Dr. Adeyemi">
        </div>
        <div class="form-group">
          <label class="form-label">Start Time</label>
          <input class="form-input" id="newStart" type="time" value="08:00">
        </div>
        <div class="form-group">
          <label class="form-label">End Time</label>
          <input class="form-input" id="newEnd" type="time" value="10:00">
        </div>
        <div class="form-group" style="grid-column:1/-1;">
          <label class="form-label">Location / Venue</label>
          <input class="form-input" id="newLocation" placeholder="e.g. ECE Block, LT1">
        </div>
      </div>
      <button class="add-btn" onclick="addClass()">Add to Timetable →</button>
    </div>
  </div>
</div>

<!-- MOBILE NAV -->
<nav class="mobile-nav">
  <div class="mobile-nav-inner">
    <a href="dashboard.html" class="mobile-nav-btn">
      <span class="mobile-nav-label">Dashboard</span>
      <div class="mobile-nav-dot"></div>
    </a>
    <a href="timetable.html" class="mobile-nav-btn active">
      <span class="mobile-nav-label">Timetable</span>
      <div class="mobile-nav-dot"></div>
    </a>
    <a href="profile.html" class="mobile-nav-btn">
      <span class="mobile-nav-label">Profile</span>
      <div class="mobile-nav-dot"></div>
    </a>
  </div>
</nav>

<script type="module" src="js/pages/timetable.js"></script>
</body>
</html>
