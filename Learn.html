<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unify — Learn</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#22C55E">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<script src="js/register-sw.js" defer></script>
<script>
  const _t = localStorage.getItem('unify-theme');
  if (_t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else if (_t === 'light') document.documentElement.setAttribute('data-theme', 'light');
</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green: #22C55E;
  --green-dark: #16A34A;
  --green-light: #DCFCE7;
  --green-text: #15803D;
  --bg: #F5F7FA;
  --surface: #FFFFFF;
  --text: #111827;
  --text2: #6B7280;
  --text3: #9CA3AF;
  --border: #E5E7EB;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --radius: 16px;
}

[data-theme="dark"] {
  --bg: #0F172A;
  --surface: #1E293B;
  --text: #F1F5F9;
  --text2: #94A3B8;
  --text3: #64748B;
  --border: #334155;
  --shadow-sm: 0 1px 4px rgba(0,0,0,0.3);
  --green-light: rgba(34,197,94,0.12);
  --green-text: #4ADE80;
}

html, body {
  font-family: 'DM Sans', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

body { max-width: 480px; margin: 0 auto; }

/* ── LOADING ─────────────────────────────────────── */
#loadingOverlay {
  position: fixed; inset: 0;
  background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 14px;
  z-index: 1000;
  transition: opacity 0.25s;
}
#loadingOverlay.hidden { opacity: 0; pointer-events: none; }
.loading-spinner {
  width: 34px; height: 34px;
  border: 3px solid var(--border);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin 0.75s linear infinite;
}
.loading-text { font-size: 13px; color: var(--text2); font-weight: 500; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── VIEWS ───────────────────────────────────────── */
.view { min-height: 100vh; padding-bottom: 120px; display: none; }
.view.active { display: block; }

/* ── APP HEADER ──────────────────────────────────── */
.app-header {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 16px;
  background: var(--bg);
  position: sticky; top: 0; z-index: 10;
}
.btn-icon {
  width: 40px; height: 40px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  text-decoration: none;
  transition: background 0.15s;
  flex-shrink: 0;
}
.btn-icon:hover { background: var(--border); }
.header-spacer { flex: 1; }
.header-theme-btn {
  width: 40px; height: 40px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text2);
  font-size: 14px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

/* ── COURSE VIEW ─────────────────────────────────── */
.course-hero {
  padding: 16px 20px 20px;
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 12px;
}
.course-hero-left { flex: 1; }
.course-code-h { font-size: 36px; font-weight: 800; color: var(--text); line-height: 1.05; }
.course-dept-p { font-size: 14px; color: var(--text2); margin-top: 5px; }
.course-tags { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.tag {
  background: var(--surface);
  border: 1.5px solid var(--border);
  color: var(--text2);
  font-size: 12px; font-weight: 500;
  padding: 4px 12px; border-radius: 20px;
}
.course-icon-box {
  width: 58px; height: 58px;
  background: var(--green-light);
  border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; flex-shrink: 0;
}

/* Continue card */
.continue-card {
  margin: 0 16px 20px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  display: flex; align-items: center; gap: 12px;
  cursor: pointer; box-shadow: var(--shadow-sm);
}
.continue-icon-box {
  width: 42px; height: 42px;
  background: var(--green-light);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
}
.continue-info { flex: 1; min-width: 0; }
.continue-label { font-size: 10px; color: var(--text3); font-weight: 700; text-transform: uppercase; letter-spacing: 0.7px; }
.continue-desc { font-size: 14px; font-weight: 700; color: var(--text); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.continue-sub { font-size: 12px; color: var(--text2); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.resume-btn {
  background: var(--green); color: #fff; border: none;
  border-radius: 10px; padding: 10px 16px;
  font-size: 13px; font-weight: 700; cursor: pointer;
  white-space: nowrap; flex-shrink: 0;
}

/* Section */
.section { margin: 0 16px 24px; }
.section-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.section-title { font-size: 16px; font-weight: 700; color: var(--text); }
.section-accent { font-size: 13px; font-weight: 600; color: var(--green-text); }

/* Progress bar */
.progress-track { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--green); border-radius: 4px; transition: width 0.4s ease; }
.progress-sub { font-size: 12px; color: var(--text3); margin-top: 6px; text-align: right; }

/* Weeks list */
.weeks-list { display: flex; flex-direction: column; gap: 8px; }
.week-row-btn {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
  cursor: pointer; width: 100%; text-align: left;
  box-shadow: var(--shadow-sm);
  transition: border-color 0.15s;
}
.week-row-btn:hover { border-color: var(--green); }
.week-status-circle {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; flex-shrink: 0; color: var(--text3);
}
.week-status-circle.done { background: var(--green); border-color: var(--green); color: #fff; }
.week-status-circle.partial { border-color: var(--green); color: var(--green-text); }
.week-row-info { flex: 1; min-width: 0; }
.week-row-name { font-size: 14px; font-weight: 700; color: var(--text); }
.week-row-sub { font-size: 12px; color: var(--text2); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.week-row-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.week-row-count { font-size: 12px; color: var(--text3); }
.week-row-arrow { color: var(--text3); font-size: 16px; }

/* ── WEEK VIEW ───────────────────────────────────── */
.week-hero {
  padding: 16px 20px 20px;
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 16px;
}
.week-hero-left { flex: 1; }
.week-hero-title { font-size: 36px; font-weight: 800; line-height: 1.05; }
.week-hero-meta { font-size: 14px; color: var(--text2); margin-top: 6px; }

/* Progress ring */
.ring-wrap { position: relative; width: 80px; height: 80px; flex-shrink: 0; }
.ring-svg { transform: rotate(-90deg); width: 80px; height: 80px; display: block; }
.ring-bg { fill: none; stroke: var(--border); stroke-width: 7; }
.ring-fill {
  fill: none; stroke: var(--green); stroke-width: 7;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.5s cubic-bezier(.4,0,.2,1);
}
.ring-inner {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.ring-count { font-size: 14px; font-weight: 800; color: var(--text); }
.ring-label { font-size: 9px; color: var(--text3); font-weight: 600; margin-top: 1px; }

/* Topic cards */
.topics-list { display: flex; flex-direction: column; gap: 8px; }
.topic-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
  cursor: pointer; width: 100%; text-align: left;
  box-shadow: var(--shadow-sm);
  transition: border-color 0.15s;
}
.topic-card:hover { border-color: var(--green); }
.topic-check-circle {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; flex-shrink: 0; color: var(--text3);
  transition: all 0.2s;
}
.topic-check-circle.done { background: var(--green); border-color: var(--green); color: #fff; }
.topic-card-info { flex: 1; min-width: 0; }
.topic-card-name { font-size: 14px; font-weight: 700; color: var(--text); }
.topic-card-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
.topic-card-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.topic-time { font-size: 12px; color: var(--text3); }
.topic-arrow { color: var(--text3); font-size: 16px; }

/* Resources */
.resources-list { display: flex; flex-direction: column; gap: 8px; }
.resource-row {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
  text-decoration: none; color: var(--text);
  box-shadow: var(--shadow-sm);
  transition: border-color 0.15s;
}
.resource-row:hover { border-color: var(--green); }
.resource-icon-box {
  width: 36px; height: 36px; background: var(--bg);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; flex-shrink: 0;
}
.resource-info { flex: 1; }
.resource-name { font-size: 14px; font-weight: 500; }
.resource-type { font-size: 12px; color: var(--text3); margin-top: 1px; }
.resource-arrow { color: var(--text3); font-size: 14px; }

/* Bottom action bar */
.bottom-bar {
  position: fixed; bottom: 0;
  left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px;
  padding: 16px 20px 28px;
  background: linear-gradient(to top, var(--bg) 65%, transparent);
  z-index: 20;
}
.action-btn {
  width: 100%; background: var(--green); color: #fff;
  border: none; border-radius: 50px;
  padding: 16px 24px;
  font-size: 15px; font-weight: 700;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: background 0.2s, opacity 0.2s;
  font-family: inherit;
}
.action-btn:hover { background: var(--green-dark); }
.action-btn.done-state { background: var(--surface); color: var(--text3); border: 1.5px solid var(--border); }
.action-btn-ghost { background: var(--surface); color: var(--text); border: 1.5px solid var(--border); flex: 0 0 auto; width: auto; padding: 16px 20px; }
.action-btn-ghost:hover { background: var(--border); }
.bottom-bar-row { display: flex; gap: 10px; }

/* ── CONTENT VIEW ────────────────────────────────── */
.content-meta {
  padding: 8px 20px 12px;
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 12px;
}
.content-meta-left { flex: 1; min-width: 0; }
.content-title-h { font-size: 22px; font-weight: 800; line-height: 1.2; }
.content-type-p { font-size: 13px; color: var(--text2); margin-top: 4px; }
.status-badge {
  background: var(--green-light); color: var(--green-text);
  font-size: 11px; font-weight: 700;
  padding: 4px 10px; border-radius: 20px;
  white-space: nowrap; flex-shrink: 0; margin-top: 2px;
}
.breadcrumb { font-size: 12px; color: var(--text3); font-weight: 500; padding: 0 20px 16px; }

/* Notes iframe */
.content-frame-wrap {
  margin: 0 16px 16px;
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  border: 1.5px solid var(--border);
  min-height: 300px;
}
#notesFrameEl { width: 100%; min-height: 400px; border: none; display: block; }

/* YouTube embed */
.video-embed-wrap {
  margin: 0 16px 16px;
  border-radius: var(--radius);
  overflow: hidden;
  aspect-ratio: 16/9;
  background: #000;
}
.video-embed-wrap iframe { width: 100%; height: 100%; border: none; display: block; }

/* Empty state */
.empty-state {
  padding: 40px 20px; text-align: center; color: var(--text3);
}
.empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-text { font-size: 14px; line-height: 1.7; }

/* Toast */
.toast {
  position: fixed; bottom: 110px;
  left: 50%; transform: translateX(-50%) translateY(12px);
  background: #1E293B; color: #fff;
  padding: 10px 20px; border-radius: 50px;
  font-size: 13px; font-weight: 500;
  opacity: 0; transition: opacity 0.25s, transform 0.25s;
  pointer-events: none; z-index: 200; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- LOADING -->
<div id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">Loading your course…</div>
</div>

<div class="toast" id="toast"></div>

<!-- ══ VIEW 1: COURSE ══════════════════════════════════ -->
<div class="view" id="viewCourse">
  <header class="app-header">
    <a href="dashboard.html" class="btn-icon" title="Dashboard">←</a>
    <div class="header-spacer"></div>
    <button class="header-theme-btn" onclick="toggleLearnTheme()" title="Toggle theme">☀</button>
  </header>

  <div class="course-hero">
    <div class="course-hero-left">
      <div class="course-code-h" id="courseCodeEl">—</div>
      <div class="course-dept-p" id="courseDeptEl"></div>
      <div class="course-tags" id="courseTagsEl"></div>
    </div>
    <div class="course-icon-box" id="courseIconEl">📚</div>
  </div>

  <div class="continue-card" id="continueLearningCard" style="display:none" onclick="resumeLearning()">
    <div class="continue-icon-box">📖</div>
    <div class="continue-info">
      <div class="continue-label">Continue Learning</div>
      <div class="continue-desc" id="continueDescEl">—</div>
      <div class="continue-sub" id="continueSubEl">—</div>
    </div>
    <button class="resume-btn" onclick="event.stopPropagation();resumeLearning()">Resume</button>
  </div>

  <div class="section">
    <div class="section-row">
      <span class="section-title">Course Progress</span>
      <span class="section-accent" id="progressPctEl">0% complete</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFillEl" style="width:0%"></div>
    </div>
    <div class="progress-sub" id="progressSubEl">0 / 0 topics</div>
  </div>

  <div class="section">
    <div class="section-title" style="margin-bottom:12px;">Weeks</div>
    <div class="weeks-list" id="weeksListEl"></div>
  </div>
</div>

<!-- ══ VIEW 2: WEEK ════════════════════════════════════ -->
<div class="view" id="viewWeek">
  <header class="app-header">
    <button class="btn-icon" onclick="goToView('course')">←</button>
    <div class="header-spacer"></div>
  </header>

  <div class="week-hero">
    <div class="week-hero-left">
      <div class="week-hero-title" id="weekTitleEl">Week 1</div>
      <div class="week-hero-meta" id="weekMetaEl">0 topics</div>
    </div>
    <div class="ring-wrap">
      <svg class="ring-svg" viewBox="0 0 80 80">
        <circle class="ring-bg" cx="40" cy="40" r="30"/>
        <circle class="ring-fill" id="ringFillEl" cx="40" cy="40" r="30"
          stroke-dasharray="188.5" stroke-dashoffset="188.5"/>
      </svg>
      <div class="ring-inner">
        <div class="ring-count" id="ringCountEl">0/0</div>
        <div class="ring-label">Completed</div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title" style="margin-bottom:12px;">Topics</div>
    <div class="topics-list" id="topicsListEl"></div>
  </div>

  <div class="section" id="resourcesSectionEl" style="display:none">
    <div class="section-title" style="margin-bottom:12px;">Resources</div>
    <div class="resources-list" id="resourcesListEl"></div>
  </div>

  <div class="bottom-bar">
    <button class="action-btn" id="markWeekBtn" onclick="markWeekComplete()">✓ Mark Week Complete</button>
  </div>
</div>

<!-- ══ VIEW 3: CONTENT ═════════════════════════════════ -->
<div class="view" id="viewContent">
  <header class="app-header">
    <button class="btn-icon" onclick="backFromContent()">←</button>
    <div class="header-spacer"></div>
    <button class="btn-icon" onclick="toggleBookmark()" title="Bookmark">🔖</button>
  </header>

  <div class="content-meta">
    <div class="content-meta-left">
      <div class="content-title-h" id="contentTitleEl">—</div>
      <div class="content-type-p" id="contentTypeEl">—</div>
    </div>
    <span class="status-badge" id="contentStatusEl" style="display:none">Completed</span>
  </div>
  <div class="breadcrumb" id="contentBreadcrumbEl">—</div>

  <div class="video-embed-wrap" id="videoWrapEl" style="display:none">
    <iframe id="videoFrameEl" allowfullscreen allow="autoplay; encrypted-media"></iframe>
  </div>

  <div class="content-frame-wrap" id="notesWrapEl" style="display:none">
    <iframe id="notesFrameEl" title="Course Notes"></iframe>
  </div>

  <div id="noContentEl" style="display:none">
    <div class="empty-state">
      <div class="empty-icon">📭</div>
      <div class="empty-text">Content not uploaded yet.<br>Check back soon.</div>
    </div>
  </div>

  <div class="bottom-bar bottom-bar-row">
    <button class="action-btn" id="markCompleteBtn" onclick="toggleTopicComplete()">✓ Mark as Complete</button>
    <button class="action-btn action-btn-ghost" id="nextTopicBtn" onclick="goToNextTopic()" style="display:none">Next →</button>
  </div>
</div>

<script src="courses.js"></script>
<script src="Coursecontent.JS?v=4"></script>
<script type="module" src="js/pages/Learn.js?v=redesign-1"></script>
</body>
</html>
