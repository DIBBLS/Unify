[build]
  publish = "."
  command = ""

# Redirect root to dashboard — index.html is the old social profile page
[[redirects]]
  from = "/"
  to = "/dashboard.html"
  status = 302

[[redirects]]
  from = "/index.html"
  to = "/dashboard.html"
  status = 302

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://apis.google.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.cloudfunctions.net https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; img-src 'self' data: blob: https://*.googleusercontent.com https://*.google.com; worker-src 'self' blob:; frame-src https://accounts.google.com https://unify-b4316.firebaseapp.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'"

# Cache CSS assets (1 year, immutable)
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache JS assets (short TTL so deploys propagate quickly)
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# Cache course content pages
[[headers]]
  for = "/Coursecontents/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Service worker must never be cached so updates propagate immediately
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Data JS files must always be fresh — content changes frequently
[[headers]]
  for = "/Coursecontent.JS"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/courses.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/course2.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
