<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unify — Lesson</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/lesson.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#22C55E">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<script src="js/register-sw.js" defer></script>
<!-- Apply theme before first paint -->
<script>
  (function () {
    var t = localStorage.getItem('unify-theme');
    if (t === 'dark')  document.documentElement.setAttribute('data-theme', 'dark');
    if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
  }());
</script>
<!-- KaTeX — math rendering for formula blocks -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
  onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]})"></script>
</head>
<body>

<div id="progress-bar"></div>

<div class="topbar">
  <div class="topbar-wordmark">Unify<span>.</span></div>
  <div class="topbar-right">
    <span class="course-pill" id="course-pill">—</span>
    <button id="dark-toggle" onclick="toggleDark()">&#9790;</button>
  </div>
</div>

<div class="wrapper" id="lesson-root">
  <div id="lesson-loading" style="padding:80px 0;text-align:center;color:var(--text2);font-size:14px;">
    Loading lesson…
  </div>
</div>

<!-- Core scripts -->
<script src="js/lesson-schema.js"></script>
<script src="js/lesson-renderer.js"></script>
<script src="js/lesson-interactions.js"></script>

<!-- Firebase (loaded by firebase-config.js already on pages that need it) -->
<!-- lesson.html also works standalone with a ?data= param for preview/testing -->

<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var course = params.get('course');
  var week   = parseInt(params.get('week'), 10);
  var root   = document.getElementById('lesson-root');
  var pill   = document.getElementById('course-pill');

  function mount(data) {
    var validation = window.validateLesson ? window.validateLesson(data) : { valid: true, errors: [] };
    if (!validation.valid) {
      console.warn('Lesson validation warnings:', validation.errors);
    }
    root.innerHTML = window.renderLesson(data);
    document.title = data.course + ' — Week ' + data.week + ' | Unify';
    if (pill) pill.textContent = data.course;
  }

  function showError(msg) {
    root.innerHTML =
      '<div style="padding:80px 0;text-align:center;color:var(--text2);font-size:14px;">' +
      msg + '<br><br><a href="Learn.html" style="color:var(--green-deep)">← Back to Learn</a></div>';
  }

  // ── Preview mode: ?data=<base64 JSON> ──────
  // Useful for testing the renderer without Firebase.
  // Generate with: btoa(JSON.stringify(lessonObject))
  var rawData = params.get('data');
  if (rawData) {
    try {
      mount(JSON.parse(atob(rawData)));
    } catch (e) {
      showError('Invalid preview data: ' + e.message);
    }
    return;
  }

  // ── Production: load from Firestore ────────
  if (!course || !week) {
    showError('Missing course or week. Expected URL: lesson.html?course=MEE352&week=8');
    return;
  }

  // Wait for Firebase to initialise (firebase-config.js may load async)
  function tryFirestore(attempts) {
    if (window.db) {
      window.db.collection('lessons').doc(course + '_W' + week).get()
        .then(function (doc) {
          if (doc.exists) mount(doc.data());
          else showError('Lesson not found: ' + course + ' Week ' + week);
        })
        .catch(function (err) { showError('Error loading lesson: ' + err.message); });
    } else if (attempts > 0) {
      setTimeout(function () { tryFirestore(attempts - 1); }, 300);
    } else {
      showError('Firebase not available. Lesson could not be loaded.');
    }
  }

  tryFirestore(10);
}());
</script>

</body>
</html>
