<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unify — Notes</title>
<script>
  const _t = localStorage.getItem('unify-theme');
  if (_t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else if (_t === 'light') document.documentElement.setAttribute('data-theme', 'light');
</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --green: #22C55E; --bg: #F5F7FA; --surface: #fff; --text: #111; --text2: #555; --border: #E5E7EB; }
[data-theme="dark"] { --bg: #111111; --surface: #1C1C1E; --text: #F5F5F5; --text2: #A1A1AA; --border: #2C2C2E; }

html, body { font-family: 'DM Sans', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* ── BACK BAR ─── */
.note-topbar {
  position: sticky; top: 0; z-index: 200;
  height: 48px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px;
}
.note-back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 600; color: var(--text2);
  text-decoration: none; border: none; background: none;
  cursor: pointer; padding: 6px 10px; border-radius: 8px;
  transition: background 0.15s;
}
.note-back-btn:hover { background: var(--border); color: var(--text); }
.note-course-label {
  font-size: 11px; font-weight: 600; color: var(--text2);
  letter-spacing: 0.05em; text-transform: uppercase;
}
.note-theme-btn {
  margin-left: auto; width: 32px; height: 32px;
  border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text2);
  font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

/* ── LOADING ─── */
#loadingState {
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 12px;
  min-height: 60vh; font-size: 13px; color: var(--text2);
}
.load-spinner {
  width: 32px; height: 32px; border: 3px solid var(--border);
  border-top-color: var(--green); border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#errorState { display: none; padding: 40px 20px; text-align: center; font-size: 14px; color: var(--text2); }

/* The injected .wrapper has padding-top:88px for its own fixed topbar.
   We provide our own topbar above, so reset that offset. */
#noteBody .wrapper { padding-top: 20px !important; padding-bottom: 60px !important; }
#noteBody { display: none; }
</style>
</head>
<body>

<div class="note-topbar">
  <a href="#" class="note-back-btn" id="backBtn">← Back</a>
  <span class="note-course-label" id="courseLabel"></span>
  <button class="note-theme-btn" onclick="toggleNoteTheme()" title="Toggle theme">☀</button>
</div>

<div id="loadingState">
  <div class="load-spinner"></div>
  <span>Loading note…</span>
</div>
<div id="errorState">Content not found for this week.</div>
<div id="noteBody"></div>

<script type="module">
import { auth, db } from './js/firebase-config.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

function normCode(raw) {
  return String(raw || '').trim().toUpperCase().replace(/\s+/g, ' ');
}

function toggleNoteTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const next = isDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('unify-theme', next);
}
window.toggleNoteTheme = toggleNoteTheme;

onAuthStateChanged(auth, async user => {
  if (!user) { window.location.href = 'Auth.html'; return; }

  const params  = new URLSearchParams(window.location.search);
  const rawCode = params.get('courseCode') || '';
  const weekNum = parseInt(params.get('week'), 10);
  const backUrl = params.get('back') || 'Learn.html';
  const code    = normCode(rawCode);

  // Wire up back button
  document.getElementById('backBtn').addEventListener('click', e => {
    e.preventDefault();
    window.location.href = backUrl;
  });
  document.getElementById('courseLabel').textContent =
    code + (Number.isFinite(weekNum) ? ' · Week ' + weekNum : '');

  // Fetch HTML from Firestore
  let htmlContent = null;
  const variants = [...new Set([code, code.replace(/\s/g, '')])];
  outer: for (const variant of variants) {
    try {
      const snap = await getDocs(query(collection(db, 'courseContent'), where('courseCode', '==', variant)));
      for (const d of snap.docs) {
        const data = d.data();
        if (!Number.isFinite(weekNum) || data.week === weekNum) {
          htmlContent = data.htmlContent;
          break outer;
        }
      }
    } catch (e) {
      console.warn('[notes] Firestore error:', e);
    }
  }

  if (!htmlContent) {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('errorState').style.display = 'block';
    return;
  }

  // Parse the admin-uploaded HTML
  const parser = new DOMParser();
  const doc    = parser.parseFromString(htmlContent, 'text/html');

  // 1. Inject external stylesheets & Google Fonts (dedup by href)
  doc.querySelectorAll('link[rel="stylesheet"]').forEach(l => {
    if (document.querySelector(`link[href="${l.href}"]`)) return;
    const el = document.createElement('link');
    el.rel = 'stylesheet'; el.href = l.href;
    document.head.appendChild(el);
  });

  // 2. Inject <style> blocks
  doc.querySelectorAll('style').forEach(s => {
    const el = document.createElement('style');
    el.textContent = s.textContent;
    document.head.appendChild(el);
  });

  // 3. Strip navigation chrome only
  doc.querySelectorAll('.topbar, #progress-bar, nav, .nav, .back-bar, .week-nav, .wk-nav-strip')
     .forEach(el => el.remove());

  // 4. Find main content container
  const main = doc.querySelector(
    '.wrapper, main, article, [role="main"], ' +
    '.week-block, .week-page, ' +
    '.main-content, .week-content, .lesson-content, .content-body, ' +
    '#content, #main, .week-body'
  ) || doc.body;

  // 5. Inject content into the page
  const noteBody = document.getElementById('noteBody');
  noteBody.innerHTML = main.outerHTML || ('<div>' + main.innerHTML + '</div>');

  // 6. Load external scripts (MathJax, KaTeX, etc.) AFTER content is in DOM
  const scriptPromises = [];
  doc.querySelectorAll('script[src]').forEach(s => {
    if (document.querySelector(`script[src="${s.src}"]`)) return;
    const el = document.createElement('script');
    el.src = s.src;
    el.defer = false;
    el.async = false;
    const p = new Promise(res => { el.onload = el.onerror = res; });
    scriptPromises.push(p);
    document.head.appendChild(el);
  });
  await Promise.all(scriptPromises);

  // 7. Run inline scripts so interactive functions (switchTab, mcReveal, eoqSelect…) are defined
  doc.querySelectorAll('script:not([src])').forEach(s => {
    const el = document.createElement('script');
    el.textContent = s.textContent;
    document.body.appendChild(el);
  });

  // 8. Trigger MathJax typeset if it loaded
  if (window.MathJax?.typeset) {
    MathJax.typeset();
  } else if (window.MathJax?.startup?.promise) {
    window.MathJax.startup.promise.then(() => MathJax.typeset());
  }

  // Show note
  document.getElementById('loadingState').style.display = 'none';
  noteBody.style.display = 'block';

  // Restore page title
  const titleEl = doc.querySelector('title');
  if (titleEl) document.title = titleEl.textContent;
});
</script>
</body>
</html>
